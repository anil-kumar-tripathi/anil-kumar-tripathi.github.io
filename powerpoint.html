html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:20px 16px 8px;max-width:900px;margin:auto}
h1{margin:0;font-size:22px}
.sub{color:var(--mut);font-size:13px;margin-top:4px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 16px;max-width:900px;margin:auto;display:flex;gap:8px;flex-wrap:wrap}
input{flex:1 1 200px;padding:9px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font-size:15px}
button{padding:9px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);cursor:pointer;font-size:14px}
button:hover{border-color:var(--tab)}
main{max-width:900px;margin:auto;padding:0 16px 40px}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:20px 0 8px}
ul{list-style:none;margin:0;padding-left:20px;position:relative}
ul.root{padding-left:0}
li{position:relative;margin:2px 0}
ul:not(.root)>li::before{content:"";position:absolute;left:-14px;top:0;bottom:0;border-left:1px solid var(--bd)}
ul:not(.root)>li::after{content:"";position:absolute;left:-14px;top:14px;width:12px;border-top:1px solid var(--bd)}
ul:not(.root)>li:last-child::before{bottom:auto;height:14px}
.n{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:7px;cursor:pointer;user-select:none}
.tab>.n{background:var(--card);border:1px solid var(--bd);font-weight:700;color:var(--tab)}
.tab.ctx>.n{color:var(--ctx)}
.grp>.n{color:var(--grp);font-weight:600}
.cmd>.n{cursor:default;color:var(--cmd);background:var(--chip);font-size:13.5px;padding:1px 9px}
.cnt{font-size:11px;color:var(--mut);font-weight:400}
.ar{display:inline-block;transition:transform .15s;font-size:11px}
li.open>.n .ar{transform:rotate(90deg)}
li:not(.open)>ul{display:none}
li.hide{display:none}
.d{color:var(--mut);font-size:12.5px;margin-left:8px}
.tab>.d{font-size:13px}
mark{background:#ffd54f;color:#000;border-radius:3px}
#stat{color:var(--mut);font-size:13px;align-self:center}
</style>

function parse(s){return s.split(';').map(g=>{const[a,b]=g.split('=');return[a,b.split(',')]})}
function build(list,ctx){
  const ul=document.createElement('ul');ul.className='root';
  list.forEach(([t,d])=>{
    nT++;const gs=parse(d);
    const li=document.createElement('li');li.className='tab'+(ctx?' ctx':'');
    const cc=gs.reduce((a,g)=>a+g[1].length,0);
    li.innerHTML='<span class="n"><span class="ar">▶</span><span class="t">'+ic(TI[t],'📑')+t+'</span> <span class="cnt">('+gs.length+' group, '+cc+' command)</span></span>'+dd(T[t]);
    const u=document.createElement('ul');
    gs.forEach(([g,cs])=>{
      nG++;const gl=document.createElement('li');gl.className='grp';
      gl.innerHTML='<span class="n"><span class="ar">▶</span><span class="t">'+ic(GI[g],'📂')+g+'</span> <span class="cnt">('+cs.length+')</span></span>'+dd(G[g]);
      const cu=document.createElement('ul');
      cs.forEach(c=>{nC++;const cl=document.createElement('li');cl.className='cmd';cl.innerHTML='<span class="n">'+ic(CI[c],'🔹')+c+'</span>'+dd(D[c]);cu.appendChild(cl)});
      gl.appendChild(cu);u.appendChild(gl);
    });
    li.appendChild(u);ul.appendChild(li);
  });
  return ul;
}
out.insertAdjacentHTML('beforeend','<h2>Main Tabs</h2>');out.appendChild(build(MAIN,false));
out.insertAdjacentHTML('beforeend','<h2>Contextual Tabs (object select karne par dikhte hain)</h2>');out.appendChild(build(CTX,true));
stat.textContent=nT+' tab · '+nG+' group · '+nC+' command';
out.addEventListener('click',e=>{const n=e.target.closest('.n');if(!n)return;const li=n.parentElement;if(li.classList.contains('cmd'))return;li.classList.toggle('open')});
function setAll(o){out.querySelectorAll('li.tab,li.grp').forEach(l=>l.classList.toggle('open',o))}
document.getElementById('ea').onclick=()=>setAll(true);
document.getElementById('ca').onclick=()=>{q.value='';filter();setAll(false)};
function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function filter(){
  const v=q.value.trim().toLowerCase();
  out.querySelectorAll('mark').forEach(m=>m.replaceWith(m.textContent));
  out.querySelectorAll('li').forEach(l=>l.classList.remove('hide'));
  if(!v)return;
  out.querySelectorAll('li.tab').forEach(tab=>{
    let any=false;
    tab.querySelectorAll('li.grp').forEach(g=>{
      let gm=false;
      g.querySelectorAll('li.cmd').forEach(c=>{
        const s=c.querySelector('.n'),t=s.textContent;
        if(t.toLowerCase().includes(v)){gm=true;s.innerHTML=t.replace(new RegExp('('+esc(v)+')','ig'),'<mark>$1</mark>')}else c.classList.add('hide');
      });
      if(gm){g.classList.add('open');any=true}else g.classList.add('hide');
    });
    if(any)tab.classList.add('open');else tab.classList.add('hide');
  });
}
q.addEventListener('input',filter);
