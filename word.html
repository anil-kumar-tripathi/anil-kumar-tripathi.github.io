<title>MS Word 2024 – Tab, Group aur Command Tree</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15191f;--card:#1f252d;--tx:#e9eef4;--mut:#9aa7b5;--bd:#333c47;--tab:#6aa8ff;--grp:#ffb36b;--cmd:#dde5ee;--chip:#2a323c;--ctx:#c3a1f0;--ac:#6aa8ff;--tip:#3a3320;--tipb:#7a6a2e;--rb:#2b2b2b;--rbtn:#3a3a3a;--rline:#555;--rtx:#eee}}
:root[data-theme="dark"]{--bg:#15191f;--card:#1f252d;--tx:#e9eef4;--mut:#9aa7b5;--bd:#333c47;--tab:#6aa8ff;--grp:#ffb36b;--cmd:#dde5ee;--chip:#2a323c;--ctx:#c3a1f0;--ac:#6aa8ff;--tip:#3a3320;--tipb:#7a6a2e;--rb:#2b2b2b;--rbtn:#3a3a3a;--rline:#555;--rtx:#eee}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:20px 16px 8px;max-width:900px;margin:auto}
h1{margin:0;font-size:22px}
.sub{color:var(--mut);font-size:13px;margin-top:4px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 16px;max-width:900px;margin:auto;display:flex;gap:8px;flex-wrap:wrap}
input{flex:1 1 200px;padding:9px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font-size:15px}
button{padding:9px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);cursor:pointer;font-size:14px}
button:hover{border-color:var(--tab)}
main{max-width:900px;margin:auto;padding:0 16px 40px}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:20px 0 8px}
ul{list-style:none;margin:0;padding-left:20px;position:relative}
ul.root{padding-left:0}
li{position:relative;margin:2px 0}
ul:not(.root)>li::before{content:"";position:absolute;left:-14px;top:0;bottom:0;border-left:1px solid var(--bd)}
ul:not(.root)>li::after{content:"";position:absolute;left:-14px;top:14px;width:12px;border-top:1px solid var(--bd)}
ul:not(.root)>li:last-child::before{bottom:auto;height:14px}
.n{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:7px;cursor:pointer;user-select:none}
.tab>.n{background:var(--card);border:1px solid var(--bd);font-weight:700;color:var(--tab)}
.tab.ctx>.n{color:var(--ctx)}
.grp>.n{color:var(--grp);font-weight:600}
.cmd>.n{cursor:default;color:var(--cmd);background:var(--chip);font-size:13.5px;padding:1px 9px}
.cnt{font-size:11px;color:var(--mut);font-weight:400}
.d{color:var(--mut);font-size:12.5px;margin-left:8px}
.ar{display:inline-block;transition:transform .15s;font-size:11px}
li.open>.n .ar{transform:rotate(90deg)}
li:not(.open)>ul{display:none}
li.hide{display:none}
mark{background:#ffd54f;color:#000;border-radius:3px}
#stat{color:var(--mut);font-size:13px;align-self:center}
li.has>.n::after{content:" 📖"}
li.has>.n{cursor:pointer}
li.cmd:not(.open)>.det{display:none}
.det{margin:6px 0 10px 4px;padding:2px 12px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);max-width:640px;font-size:14px}
.det h3{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);margin:12px 0 6px}
.det svg{width:100%;max-width:520px;height:auto;display:block;border:1px solid var(--bd);border-radius:8px}
.det ol,.det ul{list-style:revert;padding-left:22px;margin:0}
.det ul{list-style:disc}.det ol{list-style:decimal}
.det li::before,.det li::after{display:none!important}
.det li{margin:0}
.ex{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ex>div{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;background:#fff;color:#111;min-height:52px;font-family:Calibri,Carlito,"Segoe UI",sans-serif;font-size:16px}
.ex small{display:block;font:600 11px system-ui;color:#777;margin-bottom:4px;text-transform:uppercase}
.key{display:inline-block;background:var(--chip);border:1px solid var(--bd);border-radius:6px;padding:1px 8px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.tip{background:var(--tip);border:1px solid var(--tipb);border-radius:8px;padding:8px 12px;margin-top:12px}
@media(max-width:480px){.ex{grid-template-columns:1fr}}
</style>

const DET={};C.forEach(e=>{const pa=e[8]||'Home → Font';DET[pa.split(' → ').join('|')+'|'+e[0]]=e});
function rib(cs,k,gn){const rows=Math.ceil(cs.length/7),H=10+rows*38+16;let s='<svg viewBox="0 0 330 '+H+'" role="img" aria-label="Ribbon mock"><rect width="330" height="'+H+'" fill="var(--rb)"/>';cs.forEach((c,j)=>{const x=3+(j%7)*47,y=6+Math.floor(j/7)*38,on=c[0]===k;s+='<rect x="'+x+'" y="'+y+'" width="44" height="34" rx="3" fill="var(--rbtn)" stroke="'+(on?'#e53935':'var(--rline)')+'" stroke-width="'+(on?2.5:1)+'"/><text x="'+(x+22)+'" y="'+(y+14)+'" text-anchor="middle" font-size="12">'+c[1]+'</text><text x="'+(x+22)+'" y="'+(y+28)+'" text-anchor="middle" font-size="6.5" fill="var(--rtx)" font-family="sans-serif">'+c[0].slice(0,11)+'</text>'});return s+'<text x="165" y="'+(H-4)+'" text-anchor="middle" font-size="8" fill="#e53935" font-family="sans-serif" font-weight="700">'+gn+' group · laal dabba: '+k+'</text></svg>'}
function detHTML(cl){const e=DET[cl.dataset.k];return '<div class="det"><div style="margin:8px 0">'+e[2]+'</div><h3>🖼️ Ribbon me button (chitra)</h3>'+rib(cl._cs,e[0],cl.dataset.g)+'<h3>🪜 Kaise use karein</h3><ol>'+e[3].split('|').map(x=>'<li>'+x+'</li>').join('')+'</ol><h3>✏️ Example</h3><div class="ex"><div><small>Pehle</small>'+e[4]+'</div><div><small>Baad me</small>'+e[5]+'</div></div><h3>⌨️ Shortcut</h3><span class="key">'+e[6]+'</span><div class="tip">💡 <b>Pro Tip:</b> '+e[7]+'</div></div>'}
const out=document.getElementById('out'),q=document.getElementById('q'),stat=document.getElementById('stat');
let nT=0,nG=0,nC=0,nD=0;
const P=s=>{const a=s.split('~');return{i:a[1],n:a[0],d:a[2]}};
const dd=x=>x?'<span class="d">– '+x+'</span>':'';
function build(list,ctx){
  const ul=document.createElement('ul');ul.className='root';
  list.forEach(([th,gd])=>{
    nT++;const t=P(th);
    const gs=gd.split(';').map(g=>{const[a,b]=g.split('=');return[P(a),b.split(',').map(P)]});
    const cc=gs.reduce((a,g)=>a+g[1].length,0);
    const li=document.createElement('li');li.className='tab'+(ctx?' ctx':'');
    li.innerHTML='<span class="n"><span class="ar">▶</span><span class="t">'+t.i+' '+t.n+'</span> <span class="cnt">('+gs.length+' group, '+cc+' command)</span></span>'+dd(t.d);
    const u=document.createElement('ul');
    gs.forEach(([g,cs])=>{
      nG++;const gl=document.createElement('li');gl.className='grp';
      gl.innerHTML='<span class="n"><span class="ar">▶</span><span class="t">'+g.i+' '+g.n+'</span> <span class="cnt">('+cs.length+')</span></span>'+dd(g.d);
      const cu=document.createElement('ul');
      cs.forEach(c=>{nC++;const cl=document.createElement('li');cl.className='cmd';cl.innerHTML='<span class="n">'+c.i+' '+c.n+'</span>'+dd(c.d);const kk=t.n+'|'+g.n+'|'+c.n;if(DET[kk]){cl.classList.add('has');cl.dataset.k=kk;cl.dataset.g=g.n;cl._cs=cs.map(x=>[x.n,x.i]);nD++}cu.appendChild(cl)});
      gl.appendChild(cu);u.appendChild(gl);
    });
    li.appendChild(u);ul.appendChild(li);
  });
  return ul;
}
out.insertAdjacentHTML('beforeend','<h2>Main Tabs</h2>');out.appendChild(build(MAIN,false));
out.insertAdjacentHTML('beforeend','<h2>Contextual Tabs (object select karne par dikhte hain)</h2>');out.appendChild(build(CTX,true));
stat.textContent=nT+' tab · '+nG+' group · '+nC+' command · '+nD+' me 📖 detail';
out.addEventListener('click',e=>{const n=e.target.closest('.n');if(!n)return;const li=n.parentElement;if(li.classList.contains('cmd')){if(!li.classList.contains('has'))return;if(!li.querySelector('.det'))li.insertAdjacentHTML('beforeend',detHTML(li))}li.classList.toggle('open')});
function setAll(o){out.querySelectorAll('li.tab,li.grp').forEach(l=>l.classList.toggle('open',o))}
document.getElementById('ea').onclick=()=>setAll(true);
document.getElementById('ca').onclick=()=>{q.value='';filter();setAll(false)};
function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function filter(){
  const v=q.value.trim().toLowerCase();
  out.querySelectorAll('mark').forEach(m=>m.replaceWith(m.textContent));
  out.querySelectorAll('li').forEach(l=>l.classList.remove('hide'));
  if(!v)return;
  out.querySelectorAll('li.tab').forEach(tab=>{
    let any=false;
    tab.querySelectorAll('li.grp').forEach(g=>{
      let gm=false;
      g.querySelectorAll('li.cmd').forEach(c=>{
        const s=c.querySelector('.n'),t=s.textContent;
        if(t.toLowerCase().includes(v)){gm=true;s.innerHTML=t.replace(new RegExp('('+esc(v)+')','ig'),'<mark>$1</mark>')}else c.classList.add('hide');
      });
      if(gm){g.classList.add('open');any=true}else g.classList.add('hide');
    });
    if(any)tab.classList.add('open');else tab.classList.add('hide');
  });
}
q.addEventListener('input',filter);
</script>
</body>
</html>
